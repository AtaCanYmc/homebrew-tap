name: Bump Formula

on:
  repository_dispatch:
    types: [bump-formula]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          core: true

      - name: Update formula url and sha256
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          URL: ${{ github.event.client_payload.url }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          python3 - <<'EOF'
          import os, re
          path = f"Formula/{os.environ['FORMULA']}.rb"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'^(\s*url\s+)"[^"]+"', rf'\1"{os.environ["URL"]}"', text, count=1, flags=re.M)
          text = re.sub(r'^(\s*sha256\s+)"[^"]+"', rf'\1"{os.environ["SHA256"]}"', text, count=1, flags=re.M)
          open(path, "w", encoding="utf-8").write(text)
          EOF

      - name: Update Python resources if applicable
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
        run: |
          if grep -q "Language::Python::Virtualenv" "Formula/${FORMULA}.rb"; then
            brew update-python-resources "Formula/${FORMULA}.rb"
          fi

      - name: Style and audit
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
        run: |
          brew style --fix "Formula/${FORMULA}.rb"
          brew audit --strict "Formula/${FORMULA}.rb"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(formula): bump ${{ github.event.client_payload.formula }} to ${{ github.event.client_payload.version }}"
          branch: "bump-${{ github.event.client_payload.formula }}-${{ github.event.client_payload.version }}"
          title: "${{ github.event.client_payload.formula }} ${{ github.event.client_payload.version }}"
          body: "Automated bump triggered via `repository_dispatch`."
