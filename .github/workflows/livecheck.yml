name: Weekly Livecheck

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  livecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          core: true

      - name: Run brew livecheck
        run: |
          brew livecheck --tap="${{ github.repository }}" --json | python3 - <<'EOF'
          import json, sys
          data = json.load(sys.stdin)
          outdated = [d for d in data if d.get("version", {}).get("outdated")]
          for d in outdated:
              v = d["version"]
              print(f"OUTDATED: {d['formula']} ({v.get('current')} -> {v.get('latest')})")
          print(f"Checked {len(data)} formulae, {len(outdated)} outdated.")
          EOF
